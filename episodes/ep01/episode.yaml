id: ep01
title: "75 Men Died Because a Telegram Stopped in Pennsylvania"
accent: "crimson"

# FORMAT (see CLAUDE.md, rules F1-F5)
#   Every episode is a conversation between ELIAS, an engineer of the period and a composite
#   character, and MAYA, a structural engineer of today. Elias carries the story from inside
#   the era; Maya asks what the viewer is thinking and brings the modern angle.
#   `speaker:` picks the voice. `host_shot: true` marks the scenes where we actually see them
#   (target about 90 seconds an episode) — those are the ones that get animated.
#
# Scene types:
#   image    - AI illustration from `prompt`; `actors` adds their reference sheets (max 4)
#   diagram  - HTML/CSS motion graphic drawn in code (`diagram` names which one)
#   archival - a real photo at episodes/ep01/archival/<id>.jpg, else `fallback_prompt`
#   card     - a text card drawn in code
# `shots` = extra angles of the same beat, so the edit can cut inside a scene (rule 7a).
# `hero_video` = animate this beat, seeded from its own still (rule 7b).

scenes:
  # ================================================= COLD OPEN
  - id: S01
    type: image
    speaker: elias
    hero_video: >-
      Slow cinematic push along a vast half-built steel cantilever bridge at golden hour,
      tiny workers silhouetted on the trusses, deep teal river below, warm amber haze,
      dust in the air. Photoreal, filmic, shallow depth of field.
    hero_seconds: 8
    prompt: >-
      Dramatic low angle looking up a vast half-built steel cantilever bridge at golden hour,
      workers as small silhouettes high on the steel, deep teal river below, blazing amber
      sky, strong rim light on every rivet.
    shots:
      - >-
        Tight shot of riveted steel plates with a worker's boots on a narrow beam, the river
        far below in deep teal, sun flare through the trusses, vertigo.
      - >-
        Silhouette of a lone ironworker against a blazing amber sky, standing on the very end
        of an unfinished cantilever arm.
    narration: >-
      At half past five on a Thursday afternoon in 1907, eighty-six men were standing on the
      largest bridge ever built. Fifteen seconds later, seventy-five of them were dead.
    motion: in

  - id: S02
    type: image
    speaker: elias
    prompt: >-
      Extreme close-up of a telegram lying forgotten on a dark wooden desk in a shaft of hard
      afternoon light, dust in the air, deep shadows, one bright crimson wax seal.
    shots:
      - >-
        Over-the-shoulder shot of a clerk's hand placing a telegram face-down on a stack of
        papers, warm office light, the window behind blown out white.
      - >-
        Macro shot of a brass telegraph key at rest on a desk, dust motes, a hard shaft of
        sunlight, deep shadow around it.
    narration: >-
      The warning that could have stopped it was already written. It had been sent that
      morning. It was sitting, read and understood, in an office six hundred miles away.
    motion: in

  - id: S03
    type: card
    title: "HELD TOGETHER"
    subtitle: "A true story. Elias is a composite character; everyone else is real."
    hold: 3

  # ================================================= HOSTS: THE SET-UP
  - id: S04
    type: image
    speaker: maya
    host_shot: true
    actors: [maya]
    name: "Maya"
    role: "structural engineer, today"
    hero_video: >-
      A woman in her early 30s with a short black bob and round glasses sits in a warm
      study, turning a small steel model over in her hands, then looking up and asking a
      question. Subtle natural movement, blinking, breathing. Soft key light, bokeh
      background. Premium 3D animated feature look.
    hero_seconds: 8
    prompt: >-
      Maya in a warm modern study at night, soft lamp light, a small steel truss model in her
      hands, bookshelves softly out of focus behind her, teal and amber, shallow depth of
      field. Mid-question, eyebrows up, half a smile — alert and amused.
    narration: >-
      Right, so every engineer I know has heard this one. They tell you in first year, then
      they hand you a ring so you don't forget it. Nobody ever explains the bit I actually
      care about, though. Not whose fault it was. How the steel knew first.
    motion: in

  - id: S05
    type: image
    speaker: elias
    host_shot: true
    actors: [elias]
    name: "Elias"
    role: "engineer, 1907 — a composite character"
    hero_video: >-
      A gaunt man in his early 60s with silver swept-back hair sits in a dim period study,
      lit by one warm lamp, listening, then slowly nodding and beginning to speak. Subtle
      breathing and blinking, heavy with memory. Soft key light, bokeh background. Premium
      3D animated feature look.
    hero_seconds: 8
    prompt: >-
      Elias in a dim 1900s study lit by a single warm lamp, waistcoat and loosened collar,
      drawings rolled on the desk beside him, deep teal shadow behind, shallow depth of
      field. Weary, remembering.
    narration: >-
      Then I will tell it that way. I was an engineer in those years, and I will tell you
      what we knew, what we measured, and exactly where it stopped being a question of steel
      and became a question of men.
    motion: in

  # ================================================= ACT 1: THE AMBITION
  - id: S06
    type: image
    speaker: elias
    prompt: >-
      Quebec City in the early 1900s seen across a wide teal river at sunrise, cliffs and
      spires catching warm gold light, steamships trailing smoke, a railway line stopping
      abruptly at the water's edge.
    shots:
      - >-
        Aerial view of a wide river splitting a landscape in two, a railway line ending at
        the water on one side and resuming on the other, vivid teal and gold.
      - >-
        Street-level view of a crowded 1900s waterfront, barrels and crates, steam, people
        waiting, warm late light.
    narration: >-
      Quebec had a river it could not cross. The St Lawrence cut the city off from the
      railways to the south, and the answer was to be a bridge — the longest of its kind
      anywhere on Earth.
    motion: right

  - id: S07
    type: image
    speaker: elias
    actors: [walter]
    name: "Theodore Cooper"
    role: "consulting engineer, New York"
    prompt: >-
      Walter as a distinguished 1900s American consulting engineer in a dark three-piece
      suit, standing over a drafting table in a New York office, strong window light raking
      across rolled plans, warm amber lamp against cool blue daylight, proud and commanding.
    narration: >-
      The man in charge was Theodore Cooper, one of the most respected bridge engineers in
      America. He was in his sixties. He was proud. And he wanted this to be the crowning
      work of his life.
    motion: in

  - id: S08
    type: diagram
    speaker: elias
    diagram: span_longer
    narration: >-
      To save money on the piers standing in the river, he made the main span longer. That
      sounds like a small decision. It is not. A bridge this size spends most of its strength
      carrying itself, so a longer span needs heavier steel, and heavier steel needs more
      steel again. Somewhere in that spiral, the early weight calculations were never
      properly checked.

  - id: S09
    type: image
    speaker: maya
    host_shot: true
    actors: [maya]
    prompt: >-
      Maya leaning forward in her warm study, one hand raised, caught mid-sentence with a wry
      look, lamp light catching her glasses, bokeh background in teal and amber.
    narration: >-
      And can I just say — no computer, no calculator, a slide rule and a very good memory.
      I'd have given up. But that's not the bit that still happens, is it? The arithmetic we
      can do now. What still happens is a number set early, by someone senior, that nobody
      goes back and checks once everything around it has moved.
    motion: in

  - id: S10
    type: image
    speaker: elias
    actors: [walter]
    prompt: >-
      The elderly engineer alone in a dim New York office at night, lit by one warm desk
      lamp, surrounded by unopened letters and telegrams, a walking cane against the chair,
      the glittering city cold and blue through the window behind him.
    shots:
      - >-
        Close-up of a stack of unopened letters and telegrams on a desk edge, one slipping
        off, a warm lamp pool in surrounding darkness.
      - >-
        Wide shot of an empty office at night seen from outside the window, a single lit
        desk, the city dark around it.
    narration: >-
      Cooper was unwell. Once the steel started going up, he never once travelled to see it.
      He ran the largest bridge in the world from that office, through letters, telegrams,
      and one young man.
    motion: in

  - id: S11
    type: image
    speaker: elias
    actors: [tom]
    name: "Norman McLure"
    role: "inspecting engineer, on site"
    prompt: >-
      Tom as a young 1900s inspecting engineer in a work coat and flat cap, standing on the
      open steel high above a teal river, wind in his hair, notebook in hand, bright sunlight
      and strong shadows, vertigo-inducing wide angle.
    narration: >-
      His name was Norman McLure. He was the inspecting engineer on site. Cooper's eyes. And
      in the summer of 1907, those eyes saw something wrong.
    motion: in

  # ================================================= ACT 2: THE PHYSICS
  - id: S12
    type: image
    speaker: maya
    host_shot: true
    actors: [maya, elias]
    prompt: >-
      Maya and Elias in conversation, split warm and cool lighting between them, Maya
      gesturing a question, Elias listening with his hands folded, shallow depth of field,
      teal and amber.
    narration: >-
      Hold on. Before you tell me what he saw, tell them what it means. Because if you just
      say the steel was bending, everyone pictures a shelf with too many books on it. Slow,
      sad, basically fine. That is not what this is.
    motion: in

  - id: S13
    type: diagram
    speaker: elias
    diagram: tension_compression
    narration: >-
      Quite right. There are only two ways to load any part of a structure. You may pull it,
      or you may push it. Pull a rope and it simply goes tight. Push the same rope and it
      folds at once. Pulling is forgiving. Pushing is not.

  - id: S14
    type: diagram
    speaker: elias
    diagram: ruler_push
    narration: >-
      Now take something stiff. A ruler. Press on both ends and it does not crush and it does
      not snap. It bows sideways. Press a little harder and it bows a great deal further.

  - id: S15
    type: diagram
    speaker: elias
    diagram: buckling_loop
    narration: >-
      We call that buckling, and it is the most dangerous way a structure can fail, because
      it feeds itself. The member bows. Once bowed, the same push has leverage upon it, so it
      carries less. Carrying less, it bows further. Round and round, faster each turn. A beam
      that is slowly bending is not damaged. It is accelerating.

  - id: S16
    type: diagram
    speaker: elias
    diagram: builtup_lacing
    narration: >-
      And there was a second fault, hidden in the design. The great lower chords, the members
      pushed hardest, were not solid blocks of steel. They were separate plates held together
      by thin diagonal straps we called lacing. Tie plates together tightly and they behave
      as one thick member, which is enormously strong. Tie them too lightly and each thin
      plate bows on its own.

  - id: S17
    type: image
    speaker: maya
    host_shot: true
    actors: [maya]
    prompt: >-
      Maya at a desk with a laptop showing a colourful finite element stress plot of a steel
      member, her face lit by the screen, warm lamp behind, shallow depth of field.
    narration: >-
      And this is where it gets uncomfortable for us, because that failure mode has not gone
      anywhere. What has changed is that we can see it coming. A model of that chord takes an
      afternoon now. Strain gauges would have told them the load was climbing. On a job that
      size today there would be monitoring on the critical members, reporting continuously.
      None of that existed. He had a ruler and his own judgement.
    motion: in

  - id: S18
    type: diagram
    speaker: elias
    diagram: cantilever_build
    narration: >-
      And he had one more thing against him. A cantilever bridge is built outwards into
      mid-air from its piers, with nothing beneath it. Every day of work made the arms longer,
      heavier, and harder to stop.

  # ================================================= ACT 3: THE WARNING
  - id: S19
    type: image
    speaker: elias
    actors: [tom]
    prompt: >-
      Close-up of the young engineer's hands holding a steel rule against a huge riveted
      steel member, measuring a visible bend, hard raking sunlight, crimson paint mark on the
      steel, intense focus, shallow depth of field.
    shots:
      - >-
        Macro of a steel rule laid against a riveted plate showing a clear gap, crimson chalk
        mark, hard sunlight, sharp shadows.
      - >-
        A notebook page filled with pencil measurements and dates, a thumb holding it against
        the wind, bright daylight.
    narration: >-
      In early August, McLure reported it. Cooper wrote back asking how on earth it could
      have happened. Men on site said the bend must have come that way from the works.
      McLure did not believe it. He thought it was growing.
    motion: in

  - id: S20
    type: diagram
    speaker: elias
    diagram: bend_record
    narration: >-
      So he did the only thing an engineer can do with a suspicion. He measured it, wrote
      down the date, and measured it again. On the twenty-seventh of August the bend was
      larger. It was not old damage. It was the loop, already running.

  - id: S21
    type: image
    speaker: elias
    actors: [tom]
    prompt: >-
      The young engineer alone in a warmly lit 1900s train carriage at night, leather bag on
      his knees, rain streaking the dark window, his reflection doubled in the glass, amber
      lamp light, deep blue night outside.
    narration: >-
      He did not send a telegram. He wrote a letter, and then he boarded a train to New York
      to put it in front of Cooper himself.
    motion: in

  - id: S22
    type: image
    speaker: elias
    actors: [walter, tom]
    prompt: >-
      The elderly engineer and the young engineer facing each other across a drafting table
      covered in plans, bright morning light flooding the office, the older man gripping the
      table edge, sudden understanding on his face.
    narration: >-
      On the morning of the twenty-ninth they met. This time Cooper understood at once.
    motion: in

  - id: S23
    type: diagram
    speaker: elias
    diagram: telegram_race
    narration: >-
      At sixteen minutes past twelve a telegram left New York for the bridge company's office
      in Pennsylvania. It said to put no more load on the bridge until the facts had been
      considered. It arrived just after one. The men who read it talked it over, and agreed
      to meet again the next day. The warning was never sent on to Quebec.

  - id: S24
    type: image
    speaker: maya
    host_shot: true
    actors: [maya]
    prompt: >-
      Maya sitting back, hand over her mouth, the small steel model abandoned on the desk in
      front of her, lamp light low, bokeh background, quiet dismay.
    narration: >-
      Four hours. It sat there four hours, in a building full of people who understood
      exactly what it meant. There was no procedure that said who had to act on it. That is
      the thing that made me cold the first time I read this. Not the chord. The gap.
    motion: in

  # ================================================= ACT 4: THE COLLAPSE
  - id: S25
    type: image
    speaker: elias
    actors: [sam]
    hero_video: >-
      Close handheld shot of 1900s riveters working on open steel high above a river, glowing
      orange rivets, flying sparks, sunlight flaring through the trusses, men moving
      confidently and talking. Photoreal, warm, alive.
    hero_seconds: 8
    prompt: >-
      Riveting crew working high on the open steel on a bright afternoon, Sam among them,
      sleeves rolled, glowing orange rivets, sparks, laughing, the teal river far below.
    shots:
      - >-
        Close-up of a glowing orange rivet caught in a metal cone, sparks flying, dark steel
        background, intense heat glow.
      - >-
        Two workers sharing a lunch pail sitting on a beam, legs dangling over the river,
        warm afternoon light.
    narration: >-
      Hundreds of miles away, on the bridge, it was an ordinary Thursday afternoon.
      Eighty-six men were out on the steel. Among them were Mohawk ironworkers from
      Kahnawake, a community near Montreal, known for their skill and their nerve at height.
    motion: left

  - id: S26
    type: archival
    speaker: elias
    fallback_prompt: >-
      A quiet riverside village at dusk with a simple stone memorial in the foreground,
      wildflowers, warm low light across the water, a distant bridge silhouette. Respectful.
    narration: >-
      Thirty-three of them came from Kahnawake. The youngest was eighteen. The oldest was
      forty-four.
    motion: in

  - id: S27
    type: image
    speaker: elias
    prompt: >-
      Golden hour on the bridge deck, long shadows stretching across the steel, a man
      reaching for his tool bag, the low sun blazing through the trusses, dust in the light.
    narration: >-
      Just after half past five, the signal went for the end of the shift. Men began to
      gather their tools.
    motion: out

  - id: S28
    type: card
    title: ""
    hold: 1.2

  - id: S29
    type: diagram
    speaker: elias
    diagram: collapse
    narration: >-
      It took about fifteen seconds.

  - id: S30
    type: diagram
    speaker: elias
    diagram: men_grid
    narration: >-
      Of the eighty-six men on the bridge, seventy-five were killed.

  # ================================================= ACT 5: AFTER
  - id: S31
    type: image
    speaker: elias
    hero_video: >-
      Slow drift across twisted wrecked steel rising out of calm misty water at dawn, cold
      blue light with one warm sliver of sunrise, utterly still. Photoreal, sombre, cinematic.
    hero_seconds: 8
    prompt: >-
      A riverbank at dawn after the disaster, twisted steel rising from calm water, mist,
      cold blue light with a single warm sliver of sunrise, small figures standing silently
      on the shore.
    narration: >-
      In Kahnawake, two dozen women became widows in a single evening. The men were brought
      home and buried under crosses made from steel beams.
    motion: out

  - id: S32
    type: image
    speaker: elias
    prompt: >-
      Ironworkers as pure dark silhouettes, no faces visible, walking a high steel beam
      against a vivid sunset over a city skyline under construction, strong graphic shapes,
      warm amber and deep teal.
    shots:
      - >-
        Low angle of small distant ironworkers as pure dark silhouettes against the sun, no
        faces or features visible, walking a narrow beam high above a city, arms out for
        balance, vivid sunset behind.
      - >-
        Close-up of weathered hands gripping a steel cable, strong and sure, warm light, deep
        teal shadow.
    narration: >-
      Then the community made a decision. They did not give up the work. Instead their men
      would never again all work the same job at the same time, so that one accident could
      never take so many of them again. Their ironworkers went on to help raise the skylines
      of North America.
    motion: right

  - id: S33
    type: image
    speaker: elias
    prompt: >-
      A formal 1900s commission hearing room, long table, stacks of drawings and steel samples
      as evidence, hard window light, rows of men in dark suits, one empty chair in sharp
      focus in the foreground.
    shots:
      - >-
        Close-up of a failed steel chord section laid on a table as evidence, the buckle
        clearly visible, hard overhead light.
      - >-
        A commissioner's hand writing a verdict in a leather-bound ledger, nib and ink, warm
        lamp, deep shadow.
    narration: >-
      A Royal Commission investigated. It found that the chords which failed had been badly
      designed, and it blamed errors of judgment by two men: the designer, Peter Szlapka, and
      Theodore Cooper.
    motion: in

  - id: S34
    type: image
    speaker: maya
    host_shot: true
    actors: [maya, elias]
    prompt: >-
      Maya and Elias sitting opposite each other in the low lamp light, neither speaking,
      the steel model on the table between them, warm and cool light meeting in the middle,
      shallow depth of field.
    narration: >-
      Here is what has actually changed since then, and it is not the physics. We have
      independent design checks, so no single person's judgement stands alone. We have a duty
      to report, written down, with a name against it. We have monitoring that does not get
      tired or outranked. Every one of those exists because of days like this one.
    motion: in

  - id: S35
    type: image
    speaker: elias
    host_shot: true
    actors: [elias]
    prompt: >-
      Elias alone in the lamp light, looking down at his own hands, the drawings pushed
      aside, deep shadow around him, one warm highlight on his face.
    narration: >-
      And yet. The young man saw it. He measured it. He carried it by hand to the one person
      who could stop the work. Everything your rules are designed to produce, he did, on his
      own, without being told to. It was not enough. Being right has never been the same
      thing as being heard in time.
    motion: in

  - id: S36
    type: image
    speaker: elias
    prompt: >-
      1916, a huge new centre span suspended on cables being lifted between two completed
      cantilever arms over a wide river, crowds of small figures watching from the banks,
      dramatic sky, enormous sense of scale.
    narration: >-
      They built it again. In 1916, as the new centre span was being lifted into place, part
      of the lifting equipment failed. The span fell into the river. Thirteen more men died.
    motion: in

  - id: S37
    type: image
    speaker: elias
    hero_video: >-
      Slow aerial orbit around a finished steel cantilever bridge at sunrise, a freight train
      crossing, mirror-calm river reflecting an amber sky. Photoreal, majestic, cinematic.
    hero_seconds: 8
    prompt: >-
      The finished Quebec Bridge at sunrise, a freight train crossing, mirror-calm river,
      vivid amber and teal, long clean lines of steel, majestic wide shot.
    narration: >-
      The bridge was finished in 1917. Its main span is still the longest cantilever span in
      the world. Trains cross it every day.
    motion: left

  - id: S38
    type: image
    speaker: maya
    host_shot: true
    actors: [maya]
    hero_video: >-
      A woman in her early 30s turns a plain dark iron ring on her little finger, looking
      down at it, then up towards camera. Subtle breathing and blinking, warm lamp light,
      bokeh background. Premium 3D animated feature look.
    hero_seconds: 6
    prompt: >-
      Extreme close-up of Maya's hand turning a plain dark iron ring on her little finger
      above a drawing, warm lamp light, shallow depth of field, crisp detail.
    narration: >-
      In 1925 Canadian engineers began a ceremony, with an obligation written by Rudyard
      Kipling, and at the end of it each new engineer receives a ring of iron. It is not made
      from this bridge's steel. That part is a myth. But it is worn on the little finger of
      the working hand, so that every time you draw a line, it touches the page.
    motion: in

  - id: S39
    type: card
    title: "Seventy-five men in 1907. Thirteen in 1916."
    subtitle: "What would you have done with McLure's measurements?"
    hold: 5
    speaker: maya
    narration: >-
      Seventy-five men in 1907. Thirteen more in 1916. If you had been holding McLure's
      notebook, with the bend growing and the work still going on, what would you have done?
      Tell us below.

cuts:
  - id: the_hook
    scenes: [S01, S02, S04, S14, S15]
    hook: "75 men died because a telegram stopped moving"
  - id: buckling
    scenes: [S13, S14, S15, S16]
    hook: "Why steel bends instead of snapping"
  - id: the_warning
    scenes: [S19, S20, S21, S23, S24]
    hook: "He measured it. He took the train. It still wasn't enough."
