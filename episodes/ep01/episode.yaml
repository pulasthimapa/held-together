id: ep01
title: "The Telegram That Could Have Saved 75 Men"
accent: "crimson"

# Optional per-episode change of the hosts' clothing COLOURS (cast.yaml has the default
# signature look). Example:
#   wardrobe:
#     maya: "Maya wears her signature linen overshirt in deep green, open, over a plain white T-shirt, and her round thin gold wire-rimmed glasses."

# FORMAT (see CLAUDE.md, rules F1-F5)
#   Every episode is a conversation between ELIAS, an engineer of the period and a composite
#   character, and MAYA, a structural engineer of today. Elias carries the story from inside
#   the era; Maya asks what the viewer is thinking and brings the modern angle.
#   `speaker:` picks the voice. `host_shot: true` marks the scenes where we actually see them
#   (target about 90 seconds an episode) — those are the ones that get animated.
#
# Scene types:
#   image    - AI illustration from `prompt`; `actors` adds their reference sheets (max 4)
#   diagram  - HTML/CSS motion graphic drawn in code (`diagram` names which one)
#   archival - a real photo at episodes/ep01/archival/<id>.jpg, else `fallback_prompt`
#   card     - a text card drawn in code
# `shots` = extra angles of the same beat, so the edit can cut inside a scene (rule 7a).
# `hero_video` = animate this beat, seeded from its own still (rule 7b).

scenes:
  # ================================================= COLD OPEN
  - id: S01
    type: image
    speaker: elias
    hero_video: >-
      Slow cinematic push along a vast half-built steel cantilever bridge at golden hour,
      tiny workers silhouetted on the trusses, deep teal river below, warm amber haze, dust
      in the air.
    hero_seconds: 8
    prompt: >-
      Dramatic low angle looking up a vast half-built steel cantilever bridge at golden hour,
      workers as small silhouettes high on the steel, deep teal river below, blazing amber
      sky, strong rim light on every rivet.
    shots:
      - >-
        Tight shot of riveted steel plates with a worker's boots on a narrow beam, the river
        far below in deep teal, sun flare through the trusses, vertigo.
      - >-
        Silhouette of a lone ironworker against a blazing amber sky, standing on the very end
        of an unfinished cantilever arm.
    narration: >-
      Shortly after half past five on a Thursday afternoon in 1907, eighty-six men were
      working on what was meant to become the longest bridge span on Earth. Seconds
      later, seventy-five of them were dead.
    motion: in

  - id: S02
    type: image
    speaker: elias
    prompt: >-
      Extreme close-up of a telegram lying forgotten on a dark wooden desk in a shaft of hard
      afternoon light, dust in the air, deep shadows, one bright crimson wax seal.
    shots:
      - >-
        Over-the-shoulder shot of a clerk's hand placing a telegram face-down on a stack of
        papers, warm office light, the window behind blown out white.
      - >-
        Macro shot of a brass telegraph key at rest on a desk, dust motes, a hard shaft of
        sunlight, deep shadow around it.
    narration: >-
      The warning that could have saved them had already been sent. It left New York
      just after noon. By mid-afternoon it had been read, in an office five hundred
      miles away.
    motion: in

  - id: S03
    type: card
    title: "HELD TOGETHER"
    subtitle: "A true story, told by two fictional hosts. Everyone in the story is real."
    hold: 3

  # ================================================= HOSTS: THE SET-UP
  - id: S04
    camera: maya
    type: image
    speaker: maya
    host_shot: true
    actors: [maya]
    name: "Maya"
    role: "structural engineer, today"
    hero_video: >-
      Maya turns a small steel truss model in her fingers at chest height, then looks up
      towards Elias, just out of frame, and asks a question. Subtle natural movement,
      blinking, breathing.
    hero_seconds: 8
    prompt: >-
      Maya now holds a small steel truss bridge model at chest height, turning it in her
      fingers, mid-question, eyebrows raised, half a smile, alert and amused.
    narration: >-
      Right, so every engineer I know has heard this one. It's the story they tell you
      to explain why we check things. In Canada, the ceremony where new engineers get
      their iron ring traces its story back to this bridge. Nobody ever explains the bit
      I actually care about, though. Not whose fault it was. How the steel knew first.
    motion: in

  - id: S05
    camera: elias
    type: image
    speaker: elias
    host_shot: true
    actors: [elias]
    name: "Elias"
    role: "engineer, 1907 — a composite character"
    hero_video: >-
      Elias listens, then slowly nods and leans a little towards his microphone to begin
      speaking. Subtle breathing and blinking, heavy with memory.
    hero_seconds: 8
    prompt: >-
      Elias now listens, weary and remembering, eyes lowered a little, one hand resting
      on a rolled engineering drawing that lies on the table in front of him.
    narration: >-
      Then I will tell it that way. I was an engineer in those years, and I will tell you
      what we knew, what we measured, and exactly where it stopped being a question of steel
      and became a question of men.
    motion: in

  # ================================================= ACT 1: THE AMBITION
  - id: S06
    type: image
    speaker: elias
    prompt: >-
      Quebec City in the early 1900s seen across a wide teal river at sunrise, cliffs and
      spires catching warm gold light, steamships trailing smoke, a railway line stopping
      abruptly at the water's edge.
    shots:
      - >-
        Aerial view of a wide river splitting a landscape in two, a railway line ending at
        the water on one side and resuming on the other, vivid teal and gold.
      - >-
        Street-level view of a crowded 1900s waterfront, barrels and crates, steam, people
        waiting, warm late light.
    narration: >-
      Quebec had a river in the way. No railway crossed the St Lawrence at Quebec, and
      the answer was to be a bridge with the longest span ever attempted.
    motion: right

  - id: S07
    type: image
    speaker: elias
    actors: [walter]
    name: "Theodore Cooper"
    role: "consulting engineer, New York"
    prompt: >-
      Walter as a distinguished 1900s American consulting engineer in a dark three-piece
      suit, standing over a drafting table in a New York office, strong window light raking
      across rolled plans, warm amber lamp against cool blue daylight, proud and commanding.
    narration: >-
      Its consulting engineer was Theodore Cooper, one of the most respected bridge
      engineers in America. He was sixty-eight years old, and in poor health.
    motion: in

  - id: S08
    type: diagram
    speaker: elias
    diagram: span_longer
    narration: >-
      To keep the piers out of the deepest water and the winter ice, and to finish a
      year sooner, he made the main span longer: eighteen hundred feet. That sounds like
      a small decision. It is not. A bridge this size spends most of its strength
      carrying itself, so a longer span needs heavier steel, and heavier steel needs
      more steel again. The weight the design assumed was too low, and it was never
      revised. When the error came to light in 1906, Cooper judged the extra stress
      acceptable, and the work went on.

  - id: S09
    camera: ots_maya
    type: image
    speaker: maya
    host_shot: true
    actors: [maya]
    prompt: >-
      Maya is now mid-sentence with a wry look, one hand raised at chest height as she
      talks to Elias.
    narration: >-
      And can I just say, no computer, no calculator, a slide rule and a very good
      memory. I'd have given up. But that's not the bit that still happens, is it? The
      arithmetic we can do now. What still happens is a number that turns out wrong, and
      someone senior deciding it's probably fine.
    motion: in

  - id: S10
    type: image
    speaker: elias
    actors: [walter]
    prompt: >-
      The elderly engineer alone in a dim New York office at night, lit by one warm desk
      lamp, surrounded by unopened letters and telegrams, a walking cane against the chair,
      the glittering city cold and blue through the window behind him.
    shots:
      - >-
        Close-up of a stack of unopened letters and telegrams on a desk edge, one slipping
        off, a warm lamp pool in surrounding darkness.
      - >-
        Wide shot of an empty office at night seen from outside the window, a single lit
        desk, the city dark around it.
    narration: >-
      Because of his health, he did not once visit the bridge while the steel was going
      up. He ran it from his office in New York, through letters, telegrams, and the
      reports of a young inspector.
    motion: in

  - id: S11
    type: image
    speaker: elias
    actors: [tom]
    name: "Norman McLure"
    role: "inspecting engineer, on site"
    prompt: >-
      Tom as a young 1900s inspecting engineer in a work coat and flat cap, standing on the
      open steel high above a teal river, wind in his hair, notebook in hand, bright sunlight
      and strong shadows, vertigo-inducing wide angle.
    narration: >-
      His name was Norman McLure, an engineer a few years out of Princeton, inspecting
      the work on site. And in the summer of 1907, he and the other inspector began to
      see something wrong.
    motion: in

  # ================================================= ACT 2: THE PHYSICS
  - id: S12
    camera: wide
    type: image
    speaker: maya
    host_shot: true
    actors: [maya, elias]
    prompt: >-
      Maya now gestures a question across the table with one open hand; Elias listens
      with his hands folded on the table.
    narration: >-
      Hold on. Before you tell me what he saw, tell them what it means. Because if you just
      say the steel was bending, everyone pictures a shelf with too many books on it. Slow,
      sad, basically fine. That is not what this is.
    motion: in

  - id: S13
    type: diagram
    speaker: elias
    diagram: tension_compression
    narration: >-
      Quite right. There are only two ways to load any part of a structure. You may pull it,
      or you may push it. Pull a rope and it simply goes tight. Push the same rope and it
      folds at once. Pulling is forgiving. Pushing is not.

  - id: S14
    type: diagram
    speaker: elias
    diagram: ruler_push
    narration: >-
      Now take something stiff. A ruler. Press on both ends and it does not crush and it does
      not snap. It bows sideways. Press a little harder and it bows a great deal further.

  - id: S15
    type: diagram
    speaker: elias
    diagram: buckling_loop
    narration: >-
      We call that buckling, and it is the most dangerous way a structure can fail, because
      it feeds itself. The member bows. Once bowed, the same push has leverage upon it, so it
      carries less. Carrying less, it bows further. Round and round, faster each turn. A beam
      that is slowly bending is not damaged. It is accelerating.

  # Maya checks she has it (her `speech` field), over the same loop. Added for comprehension.
  - id: S15M
    type: diagram
    speaker: maya
    diagram: buckling_loop
    narration: >-
      Okay, let me check I've got this. Pull on steel and it just stretches. Push on it and
      it's fine, right up until it isn't, and then it goes sideways all at once. So the bend
      isn't a warning that something might fail. The bend is the failure, already happening.

  - id: S16
    type: diagram
    speaker: elias
    diagram: builtup_lacing
    narration: >-
      And there was a second fault, hidden in the design. The great lower chords, the
      members pushed hardest, were not solid blocks of steel. Each was four separate
      ribs, joined by light lattice bars. Tie ribs together tightly and they behave as
      one thick member, which is enormously strong. Tie them too lightly and each thin
      rib bows on its own.

  - id: S17
    camera: maya
    type: image
    speaker: maya
    host_shot: true
    actors: [maya]
    prompt: >-
      A slim silver laptop now stands open on the table beside Maya's microphone, its
      screen showing a colourful finite element stress plot of a steel member; Maya
      talks to Elias, one hand gesturing towards the screen.
    narration: >-
      And this is where it gets uncomfortable for us, because that failure mode hasn't
      gone anywhere. What's changed is that we can see it coming. A model of that chord
      would take me an afternoon. Strain gauges on it would show the stress climbing
      towards its limit. On a job that size today, you'd expect monitoring on the
      critical members, often reporting continuously. None of that existed. They had a
      ruler and their own judgement.
    motion: in

  - id: S18
    type: diagram
    speaker: elias
    diagram: cantilever_build
    narration: >-
      And he had one more thing against him. A cantilever bridge is built outwards into
      mid-air from its piers, with nothing beneath it. Every day of work made the arms longer,
      heavier, and harder to stop.

  # ================================================= ACT 3: THE WARNING
  - id: S19
    type: image
    speaker: elias
    actors: [tom]
    prompt: >-
      Close-up of the young engineer's hands holding a steel rule against a huge riveted
      steel member, measuring a visible bend, hard raking sunlight, crimson paint mark on the
      steel, intense focus, shallow depth of field.
    shots:
      - >-
        Macro of a steel rule laid against a riveted plate showing a clear gap, crimson chalk
        mark, hard sunlight, sharp shadows.
      - >-
        A notebook page filled with pencil measurements and dates, a thumb holding it against
        the wind, bright daylight.
    narration: >-
      On the sixth of August, McLure reported two chords out of line. Cooper wrote back
      asking how both of them could have become bent. The bridge company's chief
      engineer replied that the bend had no doubt been put in at the shop. McLure was
      sure they had been straight when they went up.
    motion: in

  - id: S20
    type: diagram
    speaker: elias
    diagram: bend_record
    narration: >-
      Then, on the morning of the twenty-seventh of August, the other inspector found
      that a bend in one of the great lower chords had grown. They measured it that
      afternoon. In little more than a week, one rib had gone from three quarters of an
      inch out of line to two and a quarter. It was not old damage. It was the loop,
      already running.

  - id: S21
    type: image
    speaker: elias
    actors: [tom]
    prompt: >-
      The young engineer alone in a warmly lit 1900s train carriage at night, leather bag on
      his knees, rain streaking the dark window, his reflection doubled in the glass, amber
      lamp light, deep blue night outside.
    narration: >-
      Nobody wired the alarm, for fear of frightening the men. The measurements went by
      post, and McLure was put on a train to New York to explain them to Cooper in
      person.
    motion: in

  - id: S22
    type: image
    speaker: elias
    actors: [walter, tom]
    prompt: >-
      The elderly engineer and the young engineer facing each other across a drafting table
      covered in plans, bright morning light flooding the office, the older man gripping the
      table edge, sudden understanding on his face.
    narration: >-
      Late on the morning of the twenty-ninth, Cooper reached his office and found
      McLure waiting. After a short talk, he acted.
    motion: in

  - id: S23
    type: diagram
    speaker: elias
    diagram: telegram_race
    narration: >-
      At sixteen minutes past twelve, a telegram left New York for the bridge company's
      office in Phoenixville, Pennsylvania. Add no more load to bridge, it said, till
      after due consideration of facts. It arrived at a quarter past one. The chief
      engineer did not see it until about three, and arranged to meet McLure that
      evening. Cooper had wired Pennsylvania rather than Quebec, believing it would be
      quicker. McLure had promised to wire the site. He never did. No order to stop ever
      reached the men on the bridge.

  - id: S24
    camera: maya
    type: image
    speaker: maya
    host_shot: true
    actors: [maya]
    prompt: >-
      Maya now sits back a little, one hand over her mouth, quiet dismay in her eyes; a
      small steel truss bridge model rests on the table in front of her.
    narration: >-
      Four hours. It sat there four hours. The chief engineer didn't see it till three,
      and he thought he had better news from the site, so he waited. The inquiry said it
      plainly: there was no experienced bridge engineer in charge on site. That's what
      made me go cold the first time I read this. Not the chord. The gap.
    motion: in

  # ================================================= ACT 4: THE COLLAPSE
  - id: S25
    type: image
    speaker: elias
    actors: [sam]
    hero_video: >-
      1900s riveters working on open steel high above a river, glowing orange rivets, flying
      sparks, sunlight flaring through the trusses, men moving confidently. Gentle camera
      drift.
    hero_seconds: 8
    prompt: >-
      Riveting crew working high on the open steel on a bright afternoon, Sam among them,
      sleeves rolled, glowing orange rivets, sparks, laughing, the teal river far below.
    shots:
      - >-
        Close-up of a glowing orange rivet caught in a metal cone, sparks flying, dark steel
        background, intense heat glow.
      - >-
        Two workers sharing a lunch pail sitting on a beam, legs dangling over the river,
        warm afternoon light.
    narration: >-
      Five hundred miles away, on the bridge, it was an ordinary Thursday afternoon.
      Among the men out on the steel were Mohawk ironworkers from Kahnawake, a community
      just south of Montreal, known for their skill at height.
    motion: left

  - id: S26
    type: archival
    speaker: elias
    fallback_prompt: >-
      A quiet riverside village at dusk with a simple stone memorial in the foreground,
      wildflowers, warm low light across the water, a distant bridge silhouette. Respectful.
    narration: >-
      Thirty-three of the men who died came from Kahnawake.
    motion: in

  - id: S27
    type: image
    speaker: elias
    prompt: >-
      Golden hour on the bridge deck, long shadows stretching across the steel, a man
      reaching for his tool bag, the low sun blazing through the trusses, dust in the light.
    narration: >-
      It was nearly the end of the working day.
    motion: out

  - id: S28
    type: card
    title: ""
    hold: 1.2

  - id: S29
    type: diagram
    speaker: elias
    diagram: collapse
    narration: >-
      It took a few seconds.

  - id: S30
    type: diagram
    speaker: elias
    diagram: men_grid
    narration: >-
      Of the eighty-six men, seventy-five were killed.

  # ================================================= ACT 5: AFTER
  - id: S31
    type: image
    speaker: elias
    hero_video: >-
      Slow drift across twisted wrecked steel rising out of calm misty water at dawn, cold
      blue light with one warm sliver of sunrise, mourners still on the shore. Utterly still
      and sombre.
    hero_seconds: 8
    prompt: >-
      A riverbank at dawn after the disaster, twisted steel rising from calm water, mist,
      cold blue light with a single warm sliver of sunrise, small figures standing silently
      on the shore.
    narration: >-
      In Kahnawake, about two dozen women became widows in a single evening. The men who
      could be recovered were brought home and buried together. Crosses made of steel
      still stand in their memory.
    motion: out

  - id: S32
    type: image
    speaker: elias
    prompt: >-
      Ironworkers as pure dark silhouettes, no faces visible, walking a high steel beam
      against a vivid sunset over a city skyline under construction, strong graphic shapes,
      warm amber and deep teal.
    shots:
      - >-
        Low angle of small distant ironworkers as pure dark silhouettes against the sun, no
        faces or features visible, walking a narrow beam high above a city, arms out for
        balance, vivid sunset behind.
      - >-
        Close-up of weathered hands gripping a steel cable, strong and sure, warm light, deep
        teal shadow.
    narration: >-
      Then the women of Kahnawake made a decision. Their men would not give up the work.
      But never again would so many of them work on one job at the same time. Kahnawake
      ironworkers went on to help raise the skylines of North America, from the George
      Washington Bridge to the Empire State Building.
    motion: right

  - id: S33
    type: image
    speaker: elias
    prompt: >-
      A formal 1900s commission hearing room, long table, stacks of drawings and steel samples
      as evidence, hard window light, rows of men in dark suits, one empty chair in sharp
      focus in the foreground.
    shots:
      - >-
        Close-up of a failed steel chord section laid on a table as evidence, the buckle
        clearly visible, hard overhead light.
      - >-
        A commissioner's hand writing a verdict in a leather-bound ledger, nib and ink, warm
        lamp, deep shadow.
    narration: >-
      A Royal Commission investigated. It found that the lower chords had failed because
      of their defective design, and it put that down to errors in judgment by two
      engineers: Peter Szlapka of the Phoenix Bridge Company, who designed them, and
      Theodore Cooper, who approved them. It found the bridge's own weight had been
      underestimated and never revised. And it found that although nothing could have
      saved the bridge after the twenty-seventh, the loss of life might have been
      prevented.
    motion: in

  - id: S34
    camera: wide
    type: image
    speaker: maya
    host_shot: true
    actors: [maya, elias]
    prompt: >-
      A quiet moment: neither speaks; both look down at a small steel truss bridge model
      now resting on the table between them, sombre.
    narration: >-
      Here's what has changed, and it isn't the physics. On complex highway bridges in
      the UK, the design is checked by a team from a separate organisation, so no single
      person's judgement stands alone. On new high-rise homes in England, there's now a
      legal duty to report serious safety problems to the regulator. And any engineer
      can report a concern to CROSS, in confidence. Every one of those was learned the
      hard way, from days like this one.
    motion: in

  - id: S35
    camera: elias
    type: image
    speaker: elias
    host_shot: true
    actors: [elias]
    prompt: >-
      Elias now looks down at his own hands resting on the table, sombre, a warm
      highlight on his face from the lamp.
    narration: >-
      And yet. The bend was seen. It was measured. A young man carried it by train to
      the one person who could stop the work, and that person acted. Then the warning
      waited in an office, and the promise to wire the site was never kept. Being right
      has never been the same thing as being heard in time.
    motion: in

  - id: S36
    type: image
    speaker: elias
    prompt: >-
      1916, a huge new centre span suspended on cables being lifted between two completed
      cantilever arms over a wide river, crowds of small figures watching from the banks,
      dramatic sky, enormous sense of scale.
    narration: >-
      They built it again. In 1916, as the new centre span was being lifted into place,
      a casting at one corner of the lifting gear failed. The span fell into the river,
      where it still lies. Thirteen more men died.
    motion: in

  - id: S37
    type: image
    speaker: elias
    hero_video: >-
      Slow drift towards a finished steel cantilever bridge at sunrise, a steam train
      crossing, mirror-calm river reflecting an amber sky. Majestic and calm.
    hero_seconds: 8
    prompt: >-
      The finished Quebec Bridge at sunrise, a freight train crossing, mirror-calm river,
      vivid amber and teal, long clean lines of steel, majestic wide shot.
    narration: >-
      The bridge was finished in 1917. Its main span is still the longest cantilever
      span in the world. Trains still cross it every day, and so do thousands of cars.
    motion: left

  - id: S38
    camera: insert
    type: image
    speaker: maya
    host_shot: true
    world: host   # a studio shot with no people in it
    hero_video: >-
      Very slow push in on a plain dark iron ring lying on an engineering drawing on a
      walnut table, warm lamp light shifting softly. No people, no hands, no faces ever
      appear.
    hero_seconds: 6
    prompt: >-
      A plain dark iron ring lies on an engineering drawing on the walnut table, beside
      the round base of a desk microphone stand.
    narration: >-
      In 1925, Canadian engineers held the first of a ceremony, with an obligation
      written by Rudyard Kipling. At the end of it, each new engineer receives an iron
      ring. It isn't made from this bridge's steel. That part's a myth. It's worn on the
      little finger of the working hand, and they say it brushes the page every time you
      draw a line.
    motion: in

  - id: S39
    type: card
    title: "At least 75 men in 1907. 13 more in 1916."
    subtitle: "What would you have done with McLure's measurements?"
    hold: 5
    speaker: maya
    narration: >-
      At least seventy-five men in 1907. Thirteen more in 1916. If you'd been holding
      McLure's measurements, with the bend growing and the work still going on, what
      would you have done? Tell us below.

cuts:
  - id: the_hook
    scenes: [S01, S02, S04, S14, S15]
    hook: "One telegram could have saved 75 men"
  - id: buckling
    scenes: [S13, S14, S15, S15M, S16]
    hook: "Why steel bends instead of snapping"
  - id: the_warning
    scenes: [S19, S20, S21, S23, S24]
    hook: "He measured it. He took the train. It still wasn't enough."
