id: ep01
title: "75 Men Died Because a Telegram Stopped in Pennsylvania"
accent: "crimson"

# Scene types:
#   image    - AI illustration from `prompt`; `actors` adds their reference sheets (max 4)
#   diagram  - drawn in code by pipeline/diagrams.py (`diagram` names which one)
#   archival - a real photo you place at episodes/ep01/archival/<id>.jpg;
#              if it is missing, the `fallback_prompt` illustration is used instead
#   card     - a text card drawn in code
# `hold` = seconds for scenes with no narration. `motion` = in | out | left | right.
# `name` / `role` = burned-in name card, shown the first time a person appears.
#
# Structure: cold open -> the ambition -> the physics (the teaching block) ->
# the warning -> the collapse -> the meaning. Nothing is explained twice.

scenes:
  # ---------------------------------------------------- COLD OPEN
  - id: S01
    type: image
    prompt: >-
      Dramatic low angle looking up a vast half-built steel cantilever bridge at golden hour,
      workers as small silhouettes high on the steel, deep teal river below, blazing amber sky,
      strong rim light on every rivet. Epic and alive.
    shots:
      - >-
        Tight shot of riveted steel plates with a worker's boots on a narrow beam, the river far below in deep teal, sun flare through the trusses, vertigo.
      - >-
        Silhouette of a lone ironworker against a blazing amber sky, standing on the very end of an unfinished cantilever arm.
    hero_video: >-
      Slow cinematic aerial push along a vast half-built steel cantilever bridge at golden hour, tiny workers silhouetted on the trusses, deep teal river below, warm amber sun flare, dust and haze in the air. Photoreal, filmic, shallow depth of field.
    hero_seconds: 8
    narration: >-
      At half past five on a Thursday afternoon in 1907, eighty-six men were standing on the
      largest bridge ever built. Fifteen seconds later, seventy-five of them were dead.
    motion: in

  - id: S02
    type: image
    prompt: >-
      Extreme close-up of a telegram lying forgotten on a dark wooden desk in a shaft of hard
      afternoon light, dust in the air, deep shadows, one bright crimson wax seal.
      The rest of the office is out of focus and empty.
    shots:
      - >-
        Over-the-shoulder shot of a clerk's hand placing a telegram face-down on a stack of papers, warm office light, the window behind blown out white.
      - >-
        Macro shot of a brass telegraph key at rest on a desk, dust motes, hard shaft of sunlight, deep shadow around it.
    narration: >-
      The warning that could have stopped it was already written. It had been sent that
      morning. It was sitting, read and understood, in an office six hundred miles away.
    motion: in

  - id: S03
    type: card
    title: "HELD TOGETHER"
    subtitle: "A true story. Dramatised with illustrated actors."
    hold: 3

  - id: S04
    type: diagram
    diagram: straw_vs_steel
    narration: >-
      To understand how that happens, you need one idea. And you can hold it in your hand.

  # ---------------------------------------------------- THE AMBITION
  - id: S05
    type: image
    prompt: >-
      Quebec City in the early 1900s seen across a wide teal river at sunrise, cliffs and
      spires catching warm gold light, steamships trailing smoke, a railway line stopping
      abruptly at the water's edge. Vivid, cinematic, high contrast.
    shots:
      - >-
        Aerial view of the wide St Lawrence river splitting a landscape in two, a railway line ending at the water on one side and resuming on the other, vivid teal and gold.
      - >-
        Street-level view of a crowded 1900s Quebec waterfront, barrels and crates, steam, people waiting, warm late light.
    hero_video: >-
      Slow drifting aerial over a wide river at sunrise, mist on the water, a cliff-top city with spires catching gold light, a steam ship trailing smoke. Photoreal, cinematic, vivid teal and amber.
    hero_seconds: 8
    narration: >-
      Quebec had a problem. The St Lawrence River cut the city off from the railways to the
      south. The answer was a bridge, and not just any bridge: the longest of its kind
      anywhere on Earth.
    motion: right

  - id: S06
    type: image
    actors: [elias]
    name: "Theodore Cooper"
    role: "consulting engineer, New York"
    prompt: >-
      Elias as a distinguished 1900s American engineer in a sharp dark three-piece suit,
      standing over a drafting table in a New York office, strong window light raking across
      rolled plans, warm amber lamp against cool blue daylight, proud and commanding.
    shots:
      - >-
        Close-up of an elderly engineer's hands resting on a rolled bridge drawing, a signet ring, strong side light, shallow focus.
      - >-
        A framed portrait and engineering medals on a dark office wall, raking light picking out the gold, proud and slightly cold.
    narration: >-
      The man in charge was Theodore Cooper, one of the most respected bridge engineers in
      America. He was in his sixties. He was proud. And he wanted this to be the crowning
      work of his life.
    motion: in

  - id: S07
    type: diagram
    diagram: span_longer
    narration: >-
      To save money on the piers standing in the river, Cooper made the main span longer.
      That sounds like a small decision. It isn't. A bridge this size spends most of its
      strength carrying itself, so a longer span needs heavier steel, and heavier steel needs
      more steel again. Somewhere in that spiral, the early weight calculations were never
      properly checked.

  - id: S08
    type: image
    actors: [elias]
    prompt: >-
      The same elderly engineer alone in a dim New York office at night, lit by one warm
      desk lamp, surrounded by unopened letters and telegrams, a walking cane against the
      chair, the glittering city cold and blue through the window behind him.
    shots:
      - >-
        Close-up of a stack of unopened letters and telegrams on a desk edge, one slipping off, warm lamp pool in darkness.
      - >-
        Wide shot of an empty New York office at night seen from outside the window, a single lit desk, the city dark around it.
    narration: >-
      Cooper was unwell. Once the steel started going up, he never once travelled to see it.
      He ran the biggest bridge in the world from that office, through letters, telegrams,
      and one young man.
    motion: in

  - id: S09
    type: image
    actors: [tom]
    name: "Norman McLure"
    role: "inspecting engineer, on site"
    prompt: >-
      Tom as a young 1900s inspecting engineer in a work coat and flat cap, standing on the
      open steel high above a teal river, wind in his hair, notebook in hand, bright sunlight
      and strong shadows, vertigo-inducing wide angle.
    narration: >-
      His name was Norman McLure. He was the inspecting engineer on site. Cooper's eyes.
      And in the summer of 1907, those eyes saw something wrong.
    motion: in

  # ---------------------------------------------------- THE PHYSICS
  - id: S10
    type: diagram
    diagram: tension_compression
    narration: >-
      Here is what he was looking at, and why it frightened him. There are only two ways to
      load any piece of a structure. You can pull it, or you can push it. Pull a rope and it
      simply goes tight. Push the same rope and it folds instantly. Pulling is forgiving.
      Pushing is not.

  - id: S11
    type: diagram
    diagram: ruler_push
    narration: >-
      Now take something stiff. A plastic ruler. Push on both ends and it does not crush and
      it does not snap. It bows sideways. Push a little harder and it bows a lot further.

  - id: S12
    type: diagram
    diagram: buckling_loop
    narration: >-
      Engineers call that buckling, and it is the most dangerous way a structure can fail,
      because it feeds itself. The member bows. Once it is bowed, the same push has leverage
      on it, so it carries less. Carrying less, it bows further. Round and round, faster each
      turn. A beam that is slowly bending is not damaged. It is accelerating.

  - id: S13
    type: diagram
    diagram: builtup_lacing
    narration: >-
      And there was a second problem, hidden inside the design. The great lower chords, the
      members being pushed hardest, were not solid blocks of steel. They were separate plates
      held together by thin diagonal straps called lacing. Tie plates together tightly and
      they behave like one thick member, which is enormously strong. Tie them too lightly and
      each thin plate bows on its own. The Quebec Bridge had the second kind.

  - id: S14
    type: diagram
    diagram: cantilever_build
    narration: >-
      All of this was happening on a structure with nothing underneath it. A cantilever bridge
      is built outwards into mid-air from its piers, so every day of work made the arms longer,
      heavier, and harder to stop.

  # ---------------------------------------------------- THE WARNING
  - id: S15
    type: image
    actors: [tom]
    prompt: >-
      Close-up of the young engineer's hands holding a steel rule against a huge riveted
      steel member, measuring a visible bend, hard raking sunlight, crimson paint mark on the
      steel, intense focus, shallow depth of field.
    shots:
      - >-
        Macro of a steel rule laid against a riveted plate showing a clear gap, crimson chalk mark, hard sunlight, sharp shadows.
      - >-
        A notebook page filled with pencil measurements and dates, a thumb holding it against the wind, bright daylight.
    narration: >-
      In early August, McLure reported it. Cooper wrote back asking how on earth that could
      have happened. Men on site said the bend must have come that way from the factory.
      McLure didn't believe it. He thought it was growing.
    motion: in

  - id: S16
    type: diagram
    diagram: bend_record
    narration: >-
      So he did the only thing an engineer can do with a suspicion. He measured it, wrote
      down the date, and measured it again. On the twenty-seventh of August, the bend was
      bigger. It was not old damage. It was the loop, already running.

  - id: S17
    type: image
    actors: [tom]
    prompt: >-
      The young engineer alone in a warmly lit 1900s train carriage at night, leather bag on
      his knees, rain streaking the dark window, his reflection doubled in the glass,
      amber lamp light, deep blue night outside. Tense and quiet.
    narration: >-
      He didn't send a telegram. He wrote a letter, and then he got on a train to New York to
      put it in front of Cooper himself.
    motion: in

  - id: S18
    type: image
    actors: [elias, tom]
    prompt: >-
      The elderly engineer and the young engineer facing each other across a drafting table
      covered in plans, bright morning light flooding the office, the older man gripping the
      table edge, sudden understanding on his face. High contrast, decisive moment.
    narration: >-
      On the morning of the twenty-ninth, they met. This time, Cooper understood immediately.
    motion: in

  - id: S19
    type: diagram
    diagram: telegram_race
    narration: >-
      At sixteen minutes past twelve, a telegram left New York for the bridge company's
      office in Pennsylvania. It said to put no more load on the bridge until the facts had
      been considered. It arrived just after one. The men who read it talked it over, and
      agreed to meet again the next day. The warning was never sent on to Quebec.

  # ---------------------------------------------------- THE COLLAPSE
  - id: S20
    type: image
    actors: [sam]
    prompt: >-
      Riveting crew working high on the open steel on a bright afternoon, Sam among them,
      sleeves rolled, glowing orange rivets, sparks, laughing, the teal river far below,
      brilliant sunlight. Alive, warm, utterly ordinary.
    shots:
      - >-
        Close-up of a glowing orange rivet being caught in a metal cone, sparks flying, dark steel background, intense heat glow.
      - >-
        Two workers laughing while sharing a lunch pail sitting on a beam, legs dangling over the river, warm afternoon light.
    hero_video: >-
      Close handheld shot of 1900s riveters working on open steel high above a river, glowing orange rivets, flying sparks, sunlight flaring through the trusses, men moving confidently. Photoreal, warm, alive.
    hero_seconds: 8
    narration: >-
      Hundreds of miles away, on the bridge, it was an ordinary Thursday afternoon. Eighty-six
      men were out on the steel. Among them were Mohawk ironworkers from Kahnawake, a small
      community near Montreal, known for their skill and their nerve at height.
    motion: left

  - id: S21
    type: archival
    fallback_prompt: >-
      A quiet riverside village at dusk with a simple stone memorial in the foreground,
      wildflowers, warm low light across the water, a distant bridge silhouette. Respectful.
    narration: >-
      Thirty-three of them came from Kahnawake. The youngest was eighteen. The oldest was
      forty-four.
    motion: in

  - id: S22
    type: image
    prompt: >-
      Golden hour on the bridge deck, long shadows stretching across the steel, a man
      reaching for his tool bag, the low sun blazing through the trusses, dust in the light.
      Beautiful and calm.
    narration: >-
      Just after half past five, the signal went for the end of the shift. Men began to
      gather their tools.
    motion: out

  - id: S23
    type: card
    title: ""
    hold: 1.2

  - id: S24
    type: diagram
    diagram: collapse
    narration: >-
      It took about fifteen seconds.

  - id: S25
    type: diagram
    diagram: men_grid
    narration: >-
      Of the eighty-six men on the bridge, seventy-five were killed.

  # ---------------------------------------------------- THE MEANING
  - id: S26
    type: image
    prompt: >-
      A riverbank at dawn after the disaster, twisted steel rising from calm water, mist,
      cold blue light with a single warm sliver of sunrise, small figures standing silently
      on the shore. Quiet devastation.
    hero_video: >-
      Slow drift across twisted wrecked steel rising out of calm misty water at dawn, cold blue light with one warm sliver of sunrise, utterly still. Photoreal, sombre, cinematic.
    hero_seconds: 8
    narration: >-
      In Kahnawake, two dozen women became widows in a single evening. The men were brought
      home and buried under crosses made from steel beams.
    motion: out

  - id: S27
    type: image
    prompt: >-
      Mohawk ironworkers in silhouette walking a high steel beam against a vivid sunset over
      a modern city skyline under construction, strong graphic shapes, warm amber and deep
      teal. Proud and forward-looking.
    shots:
      - >-
        Low angle of Mohawk ironworkers walking a narrow beam high above a modern city, arms out for balance, vivid sunset behind.
      - >-
        Close-up of weathered hands gripping a steel cable, strong and sure, warm light, deep teal shadow.
    narration: >-
      Then the community made a decision. They did not give up the work. Instead, their men
      would never again all work the same job at the same time, so that one accident could
      never take so many of them again. Their ironworkers went on to help raise the skylines
      of North America.
    motion: right

  - id: S28
    type: image
    prompt: >-
      A formal 1900s commission hearing room, long table, stacks of drawings and steel
      samples as evidence, hard window light, rows of men in dark suits, one empty chair in
      sharp focus in the foreground.
    shots:
      - >-
        Close-up of a failed steel chord section laid on a table as evidence, the buckle clearly visible, hard overhead light.
      - >-
        A commissioner's hand writing a verdict in a leather-bound ledger, nib and ink, warm lamp, deep shadow.
    narration: >-
      A Royal Commission investigated. It found that the chords which failed had been badly
      designed, and it blamed errors of judgment by two men: the designer, Peter Szlapka,
      and Theodore Cooper.
    motion: in

  - id: S29
    type: image
    actors: [tom]
    prompt: >-
      The young engineer standing alone at a window in low warm light, seen from behind and
      slightly above, shoulders down, the river and the wreck visible far below through
      the glass. Still and heavy.
    shots:
      - >-
        Extreme close-up of the young engineer's face in profile, jaw tight, eyes down, cool window light, shallow focus.
      - >-
        His notebook and hat left on a table by the window, the river beyond out of focus.
    narration: >-
      The young man who saw it coming had done almost everything right. He spotted the
      problem. He measured it. He carried it by hand to the one person who could stop the
      work. It was not enough. Being right is not the same as being heard in time.
    motion: in

  - id: S30
    type: image
    prompt: >-
      1916, a huge new centre span suspended on cables being lifted between two completed
      cantilever arms over a wide river, crowds of small figures watching from the banks,
      dramatic sky, vivid colour, enormous sense of scale.
    shots:
      - >-
        Close-up of thick steel lifting cables under tension, droplets of water, cold blue light, enormous scale implied.
      - >-
        Crowds of spectators on a riverbank looking up, hats and parasols, shock beginning to register, warm daylight.
    narration: >-
      They built it again. In 1916, as the new centre span was being lifted into place, part
      of the lifting equipment failed. The span fell into the river. Thirteen more men died.
    motion: in

  - id: S31
    type: image
    prompt: >-
      The finished Quebec Bridge today at sunrise, a freight train crossing, mirror-calm
      river, vivid amber and teal, long clean lines of steel, majestic wide shot.
    hero_video: >-
      Slow aerial orbit around a finished steel cantilever bridge at sunrise, a freight train crossing, mirror-calm river reflecting amber sky. Photoreal, majestic, cinematic.
    hero_seconds: 8
    narration: >-
      The bridge was finished in 1917. Its main span is still the longest cantilever span in
      the world. Trains cross it every day.
    motion: left

  - id: S32
    type: image
    prompt: >-
      Close-up of a plain dark iron ring being placed onto a young engineer's little finger
      by older hands, candlelit ceremony, warm amber glow against deep shadow, reverent.
    shots:
      - >-
        Macro of the plain dark iron ring itself resting on a dark cloth, single hard light, every facet of the rough metal visible.
      - >-
        A row of young engineers standing in candlelight with their hands held out, warm amber glow, reverent and still.
    narration: >-
      In 1925, Canadian engineers began a new ceremony. Its obligation was written by Rudyard
      Kipling. At the end of it, each new engineer receives a ring of iron.
    motion: in

  - id: S33
    type: image
    prompt: >-
      Extreme close-up of a hand drawing a bridge elevation in pencil, a plain dark iron ring
      on the little finger brushing the paper, warm lamp light, crisp detail, shallow depth
      of field.
    shots:
      - >-
        Close-up of a pencil tip meeting paper, graphite catching the light, the ring just visible at the edge of frame.
      - >-
        A finished bridge drawing on a drafting table, hands resting at its edges, warm lamp light, quiet.
    hero_video: >-
      Extreme macro, shallow focus: a pencil tip drawing a line on paper, a plain dark iron ring on the little finger brushing the page, warm lamp light, dust motes. Photoreal, intimate, filmic.
    hero_seconds: 6
    narration: >-
      The rings are not made from the bridge's steel. That is a myth. But each one carries
      its lesson. It is worn on the little finger of the working hand, so that every time an
      engineer draws a line, the ring touches the page. A reminder that behind every
      calculation there are people, trusting that somebody checked the numbers.
    motion: in

  - id: S34
    type: diagram
    diagram: buckling_loop
    note: >-
      Engineer's note. Indeepa records this in his REAL voice as audio/S34.mp3
      (the voice stage skips any file that already exists).
    narration: >-
      One last thing, from me. The thing that stays with me about this story is not the
      design error. It is the gap between knowing and acting. McLure knew. He had the
      measurements. And the system around him still took four days, two offices and a train
      journey to not quite decide anything. Every engineer I know has been in a smaller
      version of that room.

  - id: S35
    type: card
    title: "Seventy-five men in 1907. Thirteen in 1916."
    subtitle: "What would you have done with McLure's measurements?"
    hold: 5
    narration: >-
      Seventy-five men in 1907. Thirteen more in 1916. This one is for them. If you had been
      holding McLure's notebook, with the bend growing and the work still going on, what
      would you have done? Tell me below.

cuts:
  - id: the_hook
    scenes: [S01, S02, S04, S11, S12]   # S11 keeps this cut over the 61s TikTok floor
    hook: "75 men died because a telegram stopped moving"
  - id: buckling
    scenes: [S10, S11, S12, S13]
    hook: "Why steel bends instead of snapping"
  - id: the_warning
    scenes: [S15, S16, S17, S19]
    hook: "He measured it. He took the train. It still wasn't enough."
