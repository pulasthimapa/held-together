# ep01 fact sheet — rule 1. Every narrated scene must appear here (pipeline/check.py fails
# otherwise). Each claim names the source(s) it rests on. Every source was OPENED and read
# on the date given; nothing here rests on a search snippet or an AI summary.
#
# kind: fact        - checkable claims, each with sources
#       explanation - physics / how-it-works, stable textbook knowledge, no claim of record
#       opinion     - a host's own view, framed as theirs
#
# Verified 2026-10-08 by three independent passes against the sources below.

