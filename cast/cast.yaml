# Recurring cast. The hosts' faces, personas, speech, signature wardrobe and the studio NEVER
# change. The troupe (world: story) is recast and recostumed per story.
#
# TWO WORLDS (see docs/brand.md): the present is photographed, the past is painted.
#   world: host   -> Elias and Maya, the podcast. Photoreal.
#   world: story  -> everyone in the historical events. Golden-age narrative painting.
# images.py picks the style from the actors in a scene; scenes with no actors use the
# story style, because everything that is not the studio is the past.
#
# Elias is a composite character, never a named real person (rule F2).

# ---------------------------------------------------------------- the studio: now
# Lens, aperture and framing are NOT here: they belong to each camera below. One lens for
# every shot (it used to say 85mm) made the wide shots distort the hosts' proportions.
style_host: >-
  Photorealistic documentary photograph, a frame from a professionally lit, filmed podcast
  shot on a full-frame cinema camera. Real human skin with visible pores, fine lines and
  natural subsurface translucency; individual flyaway hairs; catchlights in the eyes;
  natural asymmetry; true-to-life human proportions. Soft directional key light with a gentle
  warm rim, colour-graded like a premium documentary interview, deep teal and warm amber in
  the frame. Absolutely photoreal, never illustration, 3D render or CGI. Every surface is
  plain and unbranded, with no lettering anywhere.

# ---------------------------------------------------------------- the story: the past
style_story: >-
  Golden-age narrative oil painting in the bold illustrated storytelling tradition of the
  early twentieth century. Visible confident brushwork and palette-knife texture, canvas
  tooth showing through flat areas, paint handled thickly in the light and thinly in the
  shadow. One strong directional light source; deep shadows that hold colour and are never
  black; warm amber and gold light against cool teal and slate shadow. Rich saturated colour,
  bright and luminous overall, glowing sky. Figures read as strong silhouettes first.
  Simplified suggested detail rather than tight rendering; faces carried by light and
  gesture. Heroic composition. No outlines, no cel shading, no flat vector, no cartoon
  exaggeration, not photoreal. No text, no captions, no logos, no watermark.

sheet_prompt_host: >-
  Photorealistic casting reference sheet of the same real person, four studio portraits side
  by side on one plain light-grey seamless background: front, three-quarter left, right
  profile, and from behind. {description}. Wearing a plain neutral grey crew-neck top. Soft
  even three-point studio lighting, relaxed natural expression, identical face, hair,
  features and proportions in all four portraits. Sharp focus, natural skin texture.

sheet_prompt_story: >-
  Painted character reference sheet, four portraits of the same character side by side on one
  plain warm-grey background: front, three-quarter left, right profile, and from behind.
  {description}. Wearing a plain neutral grey work shirt. Even soft light, calm expression,
  identical face, hair, features and proportions in all four portraits. Painted in the
  channel's golden-age illustration style, brushwork visible.

# ---------------------------------------------------------------- the studio set: PERMANENT
# The podcast room never changes between episodes, like the hosts' faces. images.py adds
# `description` to every studio scene and passes the reference plate (cast/sheets/studio.jpg,
# made by the cast stage from `plate_prompt`) so the room, the microphones and the seating
# stay identical. Change this only as a deliberate rebrand: it means redrawing every
# studio shot of every future episode.
studio:
  # Physical layout in plain measurements, so every camera sees the same room.
  description: >-
    The Held Together podcast studio, always exactly the same room: an intimate studio with
    dark walnut wall panelling and deep teal fabric acoustic panels. In the centre stands a
    heavy round dark walnut table, about 1.2 metres across. Elias always sits on the left
    side of the table and Maya on the right side, facing each other across it, each turned
    slightly towards the front of the room. In front of each of them, standing on the table
    top, is a black broadcast dynamic microphone on a short, heavy, round-based black desk
    stand, tilted up so the microphone head sits just below the speaker's chin, about 20
    centimetres away, never covering the mouth. A brass banker's desk lamp with an amber
    glass shade stands at the centre of the table, glowing warm. Behind them, a wall of
    walnut shelves holds a steel truss bridge model, a slide rule, a glass jar of rivets,
    rolled drawings and a brass theodolite, lit by a soft teal backlight. The table top is
    otherwise clear.
  plate_prompt: >-
    Camera A, the wide shot of the empty studio: 35mm lens at f/4, camera at seated eye
    level, 1.2 metres high, on the centre line of the table, three metres back. Both chairs
    are empty and pulled up to the table, both desk microphones in place, the lamp centred,
    the whole shelf wall visible. Symmetrical, calm composition. {description}
  sheet: studio
  # Approved master frames, one per camera, live in cast/studio/<camera>.jpg (made by the
  # cast stage). Every studio scene is an EDIT of its camera's master: only expression,
  # hands and props change, so the room, seating, microphones, framing and the hosts'
  # proportions cannot drift. This is what keeps re-draws, and their cost, near zero.
  masters_dir: studio
  # Who exists in the studio, said positively: listing what must not appear tends to make
  # the image model draw it.
  people: >-
    Elias and Maya are the only two people in the studio.
  posture: >-
    They sit naturally in their chairs at the table, upright or leaning back slightly, each
    speaking into their own desk microphone, the way people sit on a real filmed podcast,
    with their eyes on each other. Faces and hands at chest height carry the emotion.
  # The fixed camera rig. Each studio scene names one with `camera:`. Every camera is on a
  # tripod at seated eye level. `in_frame` is who the master shows; `master` describes it.
  cameras:
    wide:
      in_frame: [elias, maya]
      master: >-
        Camera A, the wide two-shot: 35mm lens at f/4, camera at seated eye level on the
        centre line of the table, three metres back. Elias sits on the left of the frame and
        Maya on the right, both seen from the top of the head to below the table edge, each
        behind their own desk microphone, the lamp glowing between them, the shelves behind.
        Both rest their hands on the table and listen to each other with calm, attentive
        expressions. Symmetrical composition, both at the same scale.
    maya:
      in_frame: [maya]
      master: >-
        Camera B, Maya's single: 85mm lens at f/2.8, camera at Maya's seated eye level, 1.6
        metres from her, on the front-left of the table and about thirty degrees off her
        eyeline. Maya is framed from mid-chest to just above her head, placed on the right
        two-thirds of the frame, looking across the table towards camera left. Her desk
        microphone stands in front of her, its head just below her chin. The left third of
        the frame is the softly blurred teal acoustic wall and shelves. Her hands rest on the
        table edge; calm, attentive expression.
    elias:
      in_frame: [elias]
      master: >-
        Camera C, Elias's single: 85mm lens at f/2.8, camera at Elias's seated eye level, 1.6
        metres from him, on the front-right of the table and about thirty degrees off his
        eyeline. Elias is framed from mid-chest to just above his head, placed on the left
        two-thirds of the frame, looking across the table towards camera right. His desk
        microphone stands in front of him, its head just below his chin. The right third of
        the frame is the softly blurred walnut panelling and shelves. His hands rest on the
        table edge; calm, attentive expression.
    ots_maya:
      in_frame: [elias, maya]
      master: >-
        Camera D, over Elias's shoulder: 50mm lens at f/2.8, camera at seated eye level just
        behind and to the left of Elias. The back of Elias's silver head and his
        shoulder in his waistcoat fill the left quarter of the frame, soft and out of focus.
        Across the table, Maya is in sharp focus from mid-chest up, facing him, behind her
        desk microphone, the lamp glowing beside her. Calm, attentive expression.
    ots_elias:
      in_frame: [elias, maya]
      master: >-
        Camera E, over Maya's shoulder: 50mm lens at f/2.8, camera at seated eye level just
        behind and to the right of Maya. The back of Maya's long black hair and her
        shoulder in her overshirt fill the right quarter of the frame, soft and out of focus.
        Across the table, Elias is in sharp focus from mid-chest up, facing her, behind his
        desk microphone, the lamp glowing beside him. Calm, attentive expression.
    insert:
      in_frame: []
      master: >-
        Camera F, the table insert: 100mm macro lens at f/4, camera just above the walnut
        table top, looking down at about thirty degrees. A close detail of an object on the
        table, the base of a desk microphone stand and the lamp's warm glow softly blurred
        behind it. An empty, quiet frame.

actors:
  # ================= the studio: two hosts, every episode, photoreal =================
  elias:
    name: Elias
    world: host
    host: true
    nationality: English
    # One line that pins who he is in motion (video) and in the picture check. Veo once
    # gave Elias glasses because the clip prompt said "keep the glasses".
    identity: >-
      Elias: clean-shaven, gaunt, silver-grey hair swept back, a bare face with no glasses.
    # Signature look in the studio. An episode may recolour it (episode.yaml `wardrobe:`).
    wardrobe: >-
      Elias wears his signature charcoal wool waistcoat over a white collarless shirt with
      the sleeves rolled once, no tie.
    description: >-
      English white man in his early 60s, tall and lean with a gaunt long narrow face, high
      prominent cheekbones, silver-grey hair swept back from a high forehead, deep-set
      grey-blue eyes under a heavy brow, a slightly aquiline nose, thin lips, clean-shaven,
      deep vertical lines either side of the mouth, weathered pale complexion with fine
      crow's feet, calm steady gaze
    persona: >-
      A proud English engineer of his era who takes real pride in what his generation built
      with slide rules and judgement. Authoritative and sure of himself, but genuinely
      curious about modern methods and openly impressed by them. Exceptional at making a
      complex structural idea simple without flattening it. Carries the weight of what went
      wrong on his watch; never defensive about it, never self-pitying.
    speech: >-
      Measured, warm, lightly formal English. Full sentences, few contractions, period
      flavour without archaism ("I should say", "quite right", "we called it"). Explains by
      analogy to ordinary objects before naming the engineering term. Pauses before the
      hardest facts. Never jokes about deaths. Asks Maya direct questions about modern
      practice and listens to the answers.
  maya:
    name: Maya
    world: host
    host: true
    nationality: Indian
    identity: >-
      Maya: long glossy black hair to the shoulders, round thin gold wire-rimmed glasses.
    wardrobe: >-
      Maya wears her signature warm amber linen overshirt, open, over a plain white T-shirt, and her
      round thin gold wire-rimmed glasses.
    description: >-
      Beautiful Indian woman in her late 20s, radiant warm golden-brown skin, large bright
      dark-brown almond eyes with long lashes, elegant arched eyebrows, high cheekbones and a
      soft heart-shaped face, full lips and a warm ready smile, long glossy black hair worn
      loose to shoulder length with a soft natural wave, delicate round thin gold wire-rimmed
      glasses, a tiny gold stud in her left nostril, youthful and lively expression
    persona: >-
      A structural engineer working today. Energetic, quick, genuinely funny, and openly
      fascinated by how people built enormous things without any of the tools she relies on.
      Asks the question the viewer is thinking, and is not embarrassed to ask the simple one.
      Excellent on modern practice: analysis, monitoring, codes, inspection regimes, what
      the profession learned and when. Her humour switches off completely when the story
      turns to people being hurt; there she is quiet and precise.
    speech: >-
      Contemporary British-Indian English, quick and natural, contractions throughout. Short
      sentences. Dry asides and self-deprecating jokes in the lighter passages ("so, no
      computer, no calculator, just vibes and a slide rule"). On tragic material the jokes
      stop entirely and she becomes direct and spare. Often reframes Elias's explanation in
      one plain sentence to check she has it right.

  # ================= the story: the troupe, painted, cast per story =================
  tom:
    name: Tom
    world: story
    description: >-
      Young man in his mid-20s, lean build, dark brown curly hair, earnest hazel-brown eyes,
      faint freckles across the nose and cheeks, clean-shaven, open youthful face, fair
      complexion
  sam:
    name: Sam
    world: story
    description: >-
      Man in his late 30s, broad-shouldered and stocky, short dark beard, weathered
      sun-tanned skin, dark brown eyes, strong calloused hands, close-cropped dark hair
  ruth:
    name: Ruth
    world: story
    description: >-
      Woman in her mid-40s, strong jaw, auburn hair pinned in a low bun, green eyes, laugh
      lines around the eyes, fair freckled complexion, calm steady expression
  walter:
    name: Walter
    world: story
    description: >-
      Man in his late 60s, heavy-set and imposing, thick white moustache, balding with white
      hair at the temples, pale blue eyes, jowled ruddy face, heavy brow, proud stubborn
      expression
