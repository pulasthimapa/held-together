<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="motion.css">
<style>
/* The runaway loop, shown physically: real steel bowing while its strength drains. */
.hero { position:absolute; left:50%; top:112px; transform:translateX(-50%);
        font-size:150px; letter-spacing:.14em; animation:heroIn .7s cubic-bezier(.2,.9,.25,1) both; }
@keyframes heroIn { from{opacity:0;transform:translateX(-50%) scale(.86);filter:blur(18px)}
                    to{opacity:1;transform:translateX(-50%) scale(1);filter:none} }
.rule { position:absolute; left:50%; top:268px; width:560px; height:9px; background:var(--red);
        transform:translateX(-50%); animation:wipeX .5s .35s cubic-bezier(.2,.9,.25,1) both;
        transform-origin:center; }

/* the member bows by scaling a curved clip; three accelerating cycles */
.bowwrap { position:absolute; left:380px; top:360px; width:1000px; height:280px; }
.bow { position:absolute; left:0; top:40px; width:1000px; height:78px;
       animation:bowing 7s cubic-bezier(.4,0,.8,1) .8s both; }
@keyframes bowing {
  0%   { transform:translateY(0)   scaleY(1);    filter:hue-rotate(0deg) }
  28%  { transform:translateY(16px) scaleY(1.0);  }
  30%  { transform:translateY(18px) }
  58%  { transform:translateY(54px) }
  60%  { transform:translateY(56px) }
  100% { transform:translateY(128px) }
}
.bow .member { left:0; top:0; width:1000px; height:78px; border-radius:60%/18%; }
.tint { position:absolute; inset:0; border-radius:60%/18%; background:var(--red);
        mix-blend-mode:multiply; opacity:0;
        animation:tinting 7s linear .8s both; }
@keyframes tinting { from{opacity:0} to{opacity:.42} }

.arrL { left:214px; top:392px; width:150px; animation:pushL 7s cubic-bezier(.4,0,.8,1) .8s both; }
.arrR { left:1566px; top:392px; width:150px; transform:rotate(180deg); transform-origin:left center;
        animation:pushR 7s cubic-bezier(.4,0,.8,1) .8s both; }
@keyframes pushL { from{transform:scaleY(1) translateX(0)} to{transform:scaleY(1.9) translateX(26px)} }
@keyframes pushR { from{transform:rotate(180deg) scaleY(1)} to{transform:rotate(180deg) scaleY(1.9) translateX(26px)} }

.meter { left:1662px; top:300px; height:380px; }
.meter .fill { height:100%; animation:drain 7s cubic-bezier(.4,0,.8,1) .8s both; }
@keyframes drain {
  0%{transform:scaleY(1);background:var(--green)}
  30%{transform:scaleY(.74);background:var(--green)}
  45%{background:var(--amber)}
  62%{transform:scaleY(.45);background:var(--amber)}
  78%{background:var(--red)}
  100%{transform:scaleY(.12);background:var(--red)}
}
.mlabel { position:absolute; left:1662px; width:78px; text-align:center; font-size:30px; font-weight:700; }

.steps { position:absolute; left:50%; top:790px; transform:translateX(-50%); text-align:center; }
.steps div { font-size:50px; margin-bottom:12px; }
.s1 { color:var(--amber); animation:stepIn .45s 1.6s cubic-bezier(.16,1.3,.4,1) both; }
.s2 { color:var(--red);   animation:stepIn .45s 3.4s cubic-bezier(.16,1.3,.4,1) both; }
.s3 { color:var(--red);   animation:stepIn .45s 5.0s cubic-bezier(.16,1.3,.4,1) both; }
@keyframes stepIn { from{opacity:0;transform:translateX(-46px) scale(.9);filter:blur(8px)}
                    to{opacity:1;transform:none;filter:none} }
.caption { animation-delay:6.2s; }
</style></head>
<body><div class="stage grid deep">
  <div class="hero black">BUCKLING</div>
  <div class="rule"></div>

  <div class="bowwrap">
    <div class="bow"><div class="member"></div><div class="tint"></div></div>
  </div>
  <div class="arrow arrL"></div>
  <div class="arrow arrR"></div>

  <div class="meter"><div class="fill"></div></div>
  <div class="mlabel" style="top:252px">STRENGTH</div>

  <div class="steps display">
    <div class="s1">1. it bows</div>
    <div class="s2">2. so it carries less</div>
    <div class="s3">3. so it bows further</div>
  </div>
  <div class="caption">Each turn of the loop is faster than the last.</div>
</div></body></html>
