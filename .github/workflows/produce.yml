name: Produce episode

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Which stage to run"
        required: true
        default: cast
        type: choice
        options: [cast, images, video, voice, render, all]
      episode:
        description: "Episode folder"
        required: true
        default: ep01

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-inter fonts-montserrat

      - name: Install Python packages
        run: pip install -r requirements.txt

      # The explainers are HTML/CSS motion graphics rendered by headless Chromium.
      - name: Install Chromium for the motion renderer
        if: inputs.stage == 'render' || inputs.stage == 'all'
        run: python -m playwright install --with-deps chromium

      - name: Run stage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python pipeline/run.py "${{ inputs.stage }}" --episode "${{ inputs.episode }}"

      # Save generated images and audio back to the repo so we never pay for them twice.
      - name: Save generated assets
        if: inputs.stage != 'render'
        run: |
          git config user.name "held-together-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cast/ episodes/
          git diff --cached --quiet || git commit -m "Generated assets: ${{ inputs.stage }} (${{ inputs.episode }})"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (another run finished first?), retrying with rebase..."
            git pull --rebase origin main
            sleep 3
          done

      - name: Upload review images
        if: inputs.stage == 'cast' || inputs.stage == 'images' || inputs.stage == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: review-${{ inputs.stage }}
          path: |
            cast/cast_review.jpg
            episodes/${{ inputs.episode }}/images_review.jpg
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload videos
        if: inputs.stage == 'render' || inputs.stage == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ inputs.episode }}
          path: episodes/${{ inputs.episode }}/output/
          retention-days: 30
