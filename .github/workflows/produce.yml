name: Produce episode

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Which stage to run"
        required: true
        default: check
        type: choice
        options: [check, cast, images, video, voice, render, all]
      episode:
        description: "Episode folder"
        required: true
        default: ep01

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-inter fonts-montserrat

      - name: Install Python packages
        run: pip install -r requirements.txt

      # The explainers are HTML/CSS motion graphics rendered by headless Chromium.
      - name: Install Chromium for the motion renderer
        if: inputs.stage == 'render' || inputs.stage == 'all'
        run: python -m playwright install --with-deps chromium

      # Runs before anything is installed or paid for. A failure here costs nothing.
      - name: Preflight checks (spends nothing)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ELIAS: ${{ secrets.ELEVENLABS_VOICE_ELIAS }}
          ELEVENLABS_VOICE_MAYA: ${{ secrets.ELEVENLABS_VOICE_MAYA }}
        run: |
          cd pipeline && python -c "import check; check.preflight('${{ inputs.stage == 'all' && 'images' || inputs.stage }}', '${{ inputs.episode }}')"

      - name: Run stage (preflight again, generate, then verify)
        if: inputs.stage != 'check'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ELIAS: ${{ secrets.ELEVENLABS_VOICE_ELIAS }}
          ELEVENLABS_VOICE_MAYA: ${{ secrets.ELEVENLABS_VOICE_MAYA }}
        run: python pipeline/run.py "${{ inputs.stage }}" --episode "${{ inputs.episode }}"

      # Save generated images and audio back to the repo so we never pay for them twice.
      # always(): if a stage fails halfway, everything already paid for is still kept,
      # and anything verify deleted as bad is removed from the repo too.
      - name: Save generated assets
        if: always() && inputs.stage != 'render' && inputs.stage != 'check'
        run: |
          git config user.name "held-together-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A cast/ episodes/
          git diff --cached --quiet || git commit -m "Generated assets: ${{ inputs.stage }} (${{ inputs.episode }})"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (another run finished first?), retrying with rebase..."
            git pull --rebase origin main
            sleep 3
          done

      - name: Upload review images
        if: always() && (inputs.stage == 'cast' || inputs.stage == 'images' || inputs.stage == 'video' || inputs.stage == 'all')
        uses: actions/upload-artifact@v4
        with:
          name: review-${{ inputs.stage }}
          path: |
            cast/cast_review.jpg
            episodes/${{ inputs.episode }}/images_review.jpg
            episodes/${{ inputs.episode }}/clips_review.jpg
            cast/studio/_rejected_*.jpg
            episodes/${{ inputs.episode }}/images/_rejected_*.jpg
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload videos
        if: inputs.stage == 'render' || inputs.stage == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ inputs.episode }}
          path: episodes/${{ inputs.episode }}/output/
          if-no-files-found: error
          retention-days: 7
